version: 2

models:
  - name: mtr_daily_active_users
    description: DAU, WAU, MAU and DAU/MAU stickiness per day.
    columns:
      - name: activity_date
        tests: [unique, not_null]
  - name: mtr_retention_weekly
    description: Cohort x weeks-since-signup retention (heatmap source).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_week, weeks_since_signup]
    columns:
      - name: retention_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
  - name: mtr_cohort_retention
    description: Day-1/7/14/30 retention per weekly signup cohort.
    columns:
      - name: cohort_week
        tests: [unique, not_null]
  - name: mtr_onboarding_funnel
    description: Ordered onboarding funnel with step conversion.
    columns:
      - name: step_order
        tests: [unique, not_null]
  - name: mtr_onboarding_retention
    description: D7 retention by whether each step was done in the first 24h.
