# Checked in on purpose: every value comes from an env var with a local default.
pulse:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('PULSE_WAREHOUSE_PATH', '../data/warehouse/pulse.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC
    snowflake:          # pip install dbt-snowflake; see snowflake/README.md
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-set') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'not-set') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', 'not-set') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'PULSE') }}"
      schema: ANALYTICS
      threads: 4
