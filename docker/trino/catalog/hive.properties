# Hive connector over the local file system with a file-based metastore:
# no HDFS / Hive Metastore service needed for a laptop setup.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///trino-metastore
fs.native-local.enabled=true
local.location=/data
hive.timestamp-precision=MICROSECONDS
